<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ee6451"/>
      <stop offset="1" stop-color="#c0372a"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5e140c" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- app squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="url(#sheen)"/>

  <!-- N monogram with a writing stroke -->
  <g fill="none" stroke="#fff6ef" stroke-width="132" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M352 700 L352 332 L672 700 L672 332"/>
  </g>

  <!-- ink dot: the 'well' -->
  <circle cx="726" cy="704" r="46" fill="#fff6ef" filter="url(#soft)"/>
</svg>
